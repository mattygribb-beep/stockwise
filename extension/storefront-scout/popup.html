<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:13px system-ui;width:350px;padding:14px;color:#15243c}h3{margin:0 0 8px}section{padding:12px;border:1px solid #d6dce6;border-radius:10px;margin:10px 0}button,select,input{padding:9px;box-sizing:border-box}button{cursor:pointer;border:0;border-radius:7px;background:#183c68;color:white;margin:4px 3px 4px 0}button.secondary{background:#e5ebf3;color:#183c68}button:disabled{opacity:.5}select,input{width:100%;margin:5px 0 9px}.hint{color:#53657b}.row{display:flex;gap:5px;flex-wrap:wrap}.row button{flex:1}#status{white-space:pre-wrap;background:#edf3fb;padding:10px;border-radius:8px}</style></head><body><h3>Source Stack · Storefront Scout</h3><p class="hint">10 saved UK storefronts. Choose one, open it, then scan.</p><section><label>Saved seller <select id="seller"></select></label><div class="row"><button id="open">Open storefront</button><button class="secondary" id="copy">Copy URL</button></div><label>Maximum pages <input id="pages" type="number" min="1" max="100" value="25"></label><button id="start">Start new scan</button><button class="secondary" id="startDetails">Scan product details</button></section><section><strong>Current scan</strong><div class="row"><button class="secondary" id="pause">Pause</button><button class="secondary" id="resume">Resume</button><button id="stop">Stop &amp; save</button></div><button class="secondary" id="refresh">Refresh status</button><p id="status" role="status">Loading…</p></section><p class="hint">Products are saved page by page to Source Stack. The extension requires Chrome on your laptop; it is not an unattended cloud scanner.</p><script src="popup.js"></script></body></html>
